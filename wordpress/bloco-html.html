<!-- Cole num bloco "HTML personalizado" (ou no widget HTML do Elementor), onde a consulta deve aparecer. -->
<div id="consulta-rise"
     data-contato="#contato"
     data-whatsapp="5561998780564"
     data-dados="https://danielsouza-adv.github.io/rise-consulta/dados/"
     data-captura="https://danielssouza.com/wp-json/contact-form-7/v1/contact-forms/1830/feedback"></div>
<script src="https://danielsouza-adv.github.io/rise-consulta/consulta-rise.js?v=6" defer></script>

<!-- data-contato é o destino do botão "Pedir análise do caso". Na página do site é a âncora
     #contato, que leva ao bloco da oferta logo abaixo. Só use um endereço completo (a LP, por
     exemplo) se a consulta estiver numa página que não tenha o formulário.

     data-captura liga o formulário "Receba este resultado por e-mail", exibido abaixo do resultado
     quando há sanção. Sem o atributo, o formulário não aparece e o rodapé volta a dizer que o CNPJ
     não é enviado. Aceita duas formas:
       · a chave do Web3Forms (o lead chega ao escritório, sem resposta automática); ou
       · a URL do Contact Form 7 no próprio site, que responde automaticamente a quem consultou:
         https://danielssouza.com/wp-json/contact-form-7/v1/contact-forms/<ID>/feedback
     Como montar os formulários no Contact Form 7: veja wordpress/contact-form-7.md -->

<!-- O ?v=2 no fim do endereço força o navegador a baixar a versão nova em vez da guardada
     em cache. Ao publicar uma mudança na ferramenta, troque para ?v=3, ?v=4 e assim por diante. -->

<!-- data-dados diz onde estão os dados. Sem ele a ferramenta descobre sozinha, mas construtores de
     página às vezes reinjetam o script e atrapalham essa descoberta; com ele, não há como errar.
     Quando a página tiver o seu próprio formulário, troque data-contato por "#contato". -->

<style>#consulta-rise{--rc-max:100%;--rc-size:18px}</style>

<!-- --rc-max faz a consulta ocupar a largura da seção (o padrão é 780px, em cartão centralizado).
     --rc-size define o tamanho do texto. Também aceita --rc-ink, --rc-gold e --rc-font. -->
