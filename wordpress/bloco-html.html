<!-- Cole num bloco "HTML personalizado" (ou no widget HTML do Elementor), onde a consulta deve aparecer. -->
<div id="consulta-rise"
     data-contato="https://rise.dssouza.com/"
     data-whatsapp="5561998780564"
     data-dados="https://danielsouza-adv.github.io/rise-consulta/dados/"
     data-captura="0ea5e920-c227-4deb-bfc7-b73f85ac9990"></div>
<script src="https://danielsouza-adv.github.io/rise-consulta/consulta-rise.js?v=5" defer></script>

<!-- data-captura é a chave do Web3Forms que recebe o formulário "Receba este resultado por e-mail",
     exibido abaixo do resultado quando há sanção. Sem esse atributo o formulário não aparece, e o
     rodapé volta a dizer que o CNPJ não é enviado. É a mesma chave usada na LP do R.I.S.E. -->

<!-- O ?v=2 no fim do endereço força o navegador a baixar a versão nova em vez da guardada
     em cache. Ao publicar uma mudança na ferramenta, troque para ?v=3, ?v=4 e assim por diante. -->

<!-- data-dados diz onde estão os dados. Sem ele a ferramenta descobre sozinha, mas construtores de
     página às vezes reinjetam o script e atrapalham essa descoberta; com ele, não há como errar.
     Quando a página tiver o seu próprio formulário, troque data-contato por "#contato". -->

<style>#consulta-rise{--rc-max:100%;--rc-size:18px}</style>

<!-- --rc-max faz a consulta ocupar a largura da seção (o padrão é 780px, em cartão centralizado).
     --rc-size define o tamanho do texto. Também aceita --rc-ink, --rc-gold e --rc-font. -->
