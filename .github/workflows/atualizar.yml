# Baixa o CEIS e o CNEP todo dia, gera os dados da consulta e publica no GitHub Pages.
name: Atualizar e publicar

on:
  schedule:
    - cron: "17 9 * * *"     # todo dia às 06:17 (horário de Brasília)
  workflow_dispatch:          # botão "Run workflow" para rodar na hora
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testes
        run: python3 -m unittest discover -s tests -v
      - name: Baixar CEIS/CNEP e gerar dados
        run: python3 gerar_dados.py --saida site/dados
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
